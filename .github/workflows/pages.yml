name: Pages

# The site is published by this workflow, not from the branch: a commit pushed by another workflow
# with the repository's GITHUB_TOKEN never triggers a GitHub Pages build (documented behaviour), so
# the APK refresh in "Release Swadaya App" would leave the download button serving the old file.
# Publishing through deploy-pages makes every update explicit. Settings → Pages → Source must be
# "GitHub Actions" for this to be the publishing source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: an older upload must not land on top of a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload and deploy are separate jobs on purpose. In one job, deploy-pages can list the run's
  # artifacts a fraction of a second after upload-pages-artifact finalizes one and find nothing,
  # failing with "No artifacts named github-pages were found" (actions/deploy-pages#451). That is
  # exactly how the first deploy of this workflow failed.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only what the pages actually load: the HTML, its stylesheet, the screenshots and guides in
      # docs/, and the APK in release/. App sources and build tooling stay out of the artifact.
      - name: Collect the site
        run: |
          mkdir -p _site
          cp ./*.html site.css _site/
          cp -r docs release _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
