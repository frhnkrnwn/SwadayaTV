name: CI

on:
  push:
    branches: [master, main]
    # A version tag (v1.9) also publishes the signed APK as a GitHub Release.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Release signing key (repository secrets, see docs/development.md). Absent on forks and pull
      # requests from them: those builds fall back to the runner's throwaway debug key.
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      # Refuse a wrapper jar that doesn't match the checksums Gradle publishes.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action's default package list still names the legacy "tools" package, which the SDK
      # repository no longer publishes: sdkmanager fails with "Failed to find package 'tools'".
      # Ask for what the build actually needs (compileSdk 36 and AGP 8.13's build tools).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'

      # Caches ~/.gradle (dependencies, wrapper distribution, build cache) between runs.
      - uses: gradle/actions/setup-gradle@v4

      # The keystore lives only in the runner's temp folder, for this job.
      - name: Release signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint, unit tests and release build
        working-directory: launcher
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleRelease

      - name: Upload the release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # The Net traffic monitor's native engine, kept out of the APK: the app downloads the files
      # for its CPU from the release and checks them against fingerprints built into that APK.
      - name: Upload the Net traffic engine
        uses: actions/upload-artifact@v4
        with:
          name: netengine
          path: launcher/app/build/outputs/netengine/release/netengine-*.so
          if-no-files-found: error
