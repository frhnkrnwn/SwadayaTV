name: Release Swadaya App

# Publishes the phone-side app (phone-app/) as a signed APK on GitHub Releases, where it can be
# downloaded straight to a phone. It runs on its own when a change to phone-app/ lands on main, and
# can be started by hand from Actions → "Release Swadaya App" → Run workflow. The tag name comes
# from versionName in phone-app/app/build.gradle, so bump that before a new release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['phone-app/**']

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Normally empty: the committed key signs every build. A rotated key in secrets replaces it.
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Read the version
        id: version
        working-directory: phone-app
        run: |
          version=$(awk -F"'" '/versionName/{print $2; exit}' app/build.gradle)
          echo "name=$version" >> "$GITHUB_OUTPUT"

      - name: Build the signed release APK
        working-directory: phone-app
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # Refuse to publish an APK that is unsigned or signed with an unexpected key.
      - name: Check the signature
        working-directory: phone-app
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "swadaya-app-${{ steps.version.outputs.name }}.apk"

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swadaya-app-release
          path: phone-app/swadaya-app-*.apk
          if-no-files-found: error

      # make_latest stays false: the launcher's own updater reads the repository's latest release
      # and must keep seeing a tvhome-*.apk there.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swadaya-app-v${{ steps.version.outputs.name }}
          name: Swadaya App ${{ steps.version.outputs.name }}
          make_latest: false
          body: |
            Swadaya App ${{ steps.version.outputs.name }} — bersihkan Android TV / Google TV dari HP.

            HP menjadi ADB host: sambung ke TV di Wi-Fi yang sama, baca isinya, lalu nonaktifkan
            aplikasi yang dipilih. Tidak ada yang di-uninstall dan semuanya bisa dipulihkan.

            Cara pakai: unduh `swadaya-app-${{ steps.version.outputs.name }}.apk` di bawah ke HP,
            pasang (izinkan "Install unknown apps" untuk browser), lalu ikuti panduan
            `docs/TUTORIAL_HP_TANPA_PC.md` di repo ini.
          files: phone-app/swadaya-app-*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
