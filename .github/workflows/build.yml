name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

# One build at a time per branch: two quick pushes must not pick the same build number.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Normally empty: every build signs with the committed release key (launcher/tvhome-release.jks
      # and launcher/keystore.properties), so the released APK installs over the one the TV has.
      # A repository secret here replaces that key when it is rotated (scripts/setup-signing.sh).
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        working-directory: launcher
        run: chmod +x gradlew

      - name: Read the version
        id: version
        working-directory: launcher
        run: |
          name=$(grep -o "versionName '[^']*'" app/build.gradle | head -1 | cut -d"'" -f2)
          code=$(grep -o 'versionCode [0-9]*' app/build.gradle | head -1 | awk '{print $2}')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # The keystore lives only in the runner's temp folder, for this job.
      - name: Release signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: launcher
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # UpdateCheck looks for tvhome-<something>.apk in the latest release: name it that way.
      - name: Name the OTA APK
        working-directory: launcher
        run: cp app/build/outputs/apk/release/app-release.apk "tvhome-${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: launcher/tvhome-*.apk

      # The build number counts the releases already published (26, 27, 28…), not the CI runs:
      # a failed run or a pull request doesn't use one up, so the series never skips.
      - name: Next build number
        if: github.event_name == 'push'
        id: buildnum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[].tag_name' | sed -n 's/.*-build\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
          echo "number=$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"

      # The app checks the latest release on GitHub (UpdateCheck), so every push publishes one.
      # The build number keeps the tag unique while the version stays readable to the app.
      # The Net traffic engine rides along: the APK leaves it out and TrafficEngine downloads the
      # files for this TV's CPU from this same release, so an APK installed from here needs no ADB.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build${{ steps.buildnum.outputs.number }}
          name: SwadayaTV ${{ steps.version.outputs.name }} build ${{ steps.buildnum.outputs.number }}
          make_latest: true
          files: |
            launcher/tvhome-*.apk
            launcher/app/build/outputs/netengine/release/netengine-*.so
          token: ${{ secrets.GITHUB_TOKEN }}

      # The site is the one place a TV gets its version from: release/tvhome-latest.apk is a name
      # without a version or build number, and release/version.json is written here from this exact
      # file, so the download button, the What's new page and the launcher's updater all describe
      # one build — without asking api.github.com (60 requests an hour per IP, shared networks use
      # them up). One previous build stays beside them for a one-tap rollback.
      # The bot push uses GITHUB_TOKEN, so it never starts another workflow.
      - name: Refresh the site's APK, version file and history
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          BUILD: ${{ steps.buildnum.outputs.number }}
        run: |
          APK="launcher/tvhome-$VERSION.apk"
          if [ -f release/tvhome-latest.apk ] && ! cmp -s release/tvhome-latest.apk "$APK"; then
            cp release/tvhome-latest.apk release/tvhome-previous.apk
          fi
          cp "$APK" release/tvhome-latest.apk
          ./scripts/write-version-json.sh "$VERSION" "$CODE" "$BUILD" "v$VERSION-build$BUILD" "$APK"
          git add release
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "chore(release): point release/tvhome-latest.apk at $VERSION build $BUILD"
          git push -q origin HEAD:main

  # That push uses GITHUB_TOKEN, and such a push never triggers another workflow — Pages included
  # (see pages.yml) — so the site would keep serving the previous APK. Deploy it here, from a
  # fresh checkout of main, so the download button and the Release always describe one build.
  site:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect the site
        run: ./scripts/collect-site.sh _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Separate from the upload for the same reason as in pages.yml: in one job, deploy-pages can look
  # for the artifact before the run lists it (actions/deploy-pages#451).
  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # A download site fails silently: the button still looks right while it serves a 404 or last
  # build's APK. This checks the live pages, both APKs (byte for byte) and the version files that
  # the updater reads, so a bad deploy is a red run instead of a report from a user.
  smoke:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check the live site
        run: ./scripts/check-site.sh
