# Swadaya App's release key. It is the launcher's committed key (../launcher/tvhome-release.jks),
# so the phone app has one fixed signature too and an APK from GitHub installs over the previous
# one. Committed on purpose, like the launcher's: this project is open source and the key only has
# to be the same in every build. SIGNING_* environment variables (CI secrets) replace these values
# when set; without any of it, release builds fall back to the machine's debug key.
storeFile=../launcher/tvhome-release.jks
storePassword=swadaya-tv-ota-2026
keyAlias=swadaya
keyPassword=swadaya-tv-ota-2026
