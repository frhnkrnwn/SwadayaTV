plugins {
    id 'com.android.application'
}

android {
    namespace 'com.swadaya.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.swadaya.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure-Java ADB client: the app is the ADB host, no computer in between.
    implementation 'dev.mobile:dadb:1.2.10'
}
