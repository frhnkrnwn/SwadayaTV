<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SwadayaTV — Android TV Launcher</title>
  <style>
    :root { --bg:#0b0f1a; --fg:#e8ecf4; --muted:#9aa4b8; --accent:#6a1b9a; --accent2:#00bcd4; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .card { max-width:640px; padding:48px 40px; text-align:center; }
    h1 { font-size:2.6rem; margin:0 0 12px; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    p { color:var(--muted); line-height:1.6; margin:0 0 28px; }
    .btn { display:inline-block; padding:14px 32px; border-radius:10px; background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#fff; text-decoration:none; font-weight:600; transition:transform .15s ease; }
    .btn:hover { transform:translateY(-2px); }
    .meta { margin-top:32px; font-size:.85rem; color:var(--muted); }
    .meta a { color:var(--accent2); text-decoration:none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>SwadayaTV</h1>
    <p>A clean, modern and lightweight Android TV Launcher. Replace the stock home screen with a calm, fast interface focused on your apps and the essentials.</p>
    <a class="btn" href="https://github.com/frhnkrnwn/SwadayaTV/releases/latest">Download Latest APK</a>
    <div class="meta">
      <a href="https://github.com/frhnkrnwn/SwadayaTV">View on GitHub</a> ·
      <a href="https://github.com/frhnkrnwn/SwadayaTV/blob/main/README.md">README</a>
    </div>
  </main>
</body>
</html>
